<style>
:root {

}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
body::before{content:'';position:fixed;inset:-50%;background:radial-gradient(ellipse at 30% 20%,rgba(78,205,196,.03),transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(78,205,196,.02),transparent 50%);z-index:-1}
.layout{display:flex;flex-direction:column;height:100vh;padding:14px 20px 10px;max-width:1480px;margin:0 auto}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:14px;flex-shrink:0}
.header-left h1{font-size:1.18rem;font-weight:800;background:linear-gradient(135deg,var(--accent),#82e0d8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-left .date,.header-left .course-meta{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--text-dim);margin-top:2px}
.stats-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.stat-chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:.72rem;font-family:'JetBrains Mono',monospace}
.stat-chip .dot{width:7px;height:7px;border-radius:50%} .total .dot{background:var(--accent)} .present .dot{background:var(--present)} .late .dot{background:var(--late)} .absent .dot{background:var(--absent)}
.btn-start{background:linear-gradient(135deg,var(--accent),#3dbeb6);color:white;padding:7px 14px;font-size:.76rem;border-radius:8px;border:none;font-family:'Noto Sans KR',sans-serif;font-weight:700;cursor:pointer;transition:.2s}
.btn-start.reverse{background:linear-gradient(135deg,#f39c12,#e67e22)} .btn-start:hover{filter:brightness(1.13)} .btn-start:disabled{opacity:.4;cursor:default;filter:none}
.voice-select{max-width:210px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:.68rem;font-family:'Noto Sans KR',sans-serif;outline:none}
.call-bar{display:none;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 0 30px var(--accent-glow);border-radius:12px;padding:11px 18px;margin-bottom:10px;flex-shrink:0;animation:fadeIn .25s ease}
.call-bar.active{display:flex} @keyframes fadeIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
.voice-indicator{display:none;align-items:center;gap:3px} .voice-indicator.active{display:flex}
.voice-bar{width:3px;height:14px;background:var(--accent);border-radius:2px;animation:voicePulse .6s ease-in-out infinite alternate} .voice-bar:nth-child(2){animation-delay:.15s} .voice-bar:nth-child(3){animation-delay:.3s} .voice-bar:nth-child(4){animation-delay:.15s}
@keyframes voicePulse{0%{height:5px;opacity:.4}100%{height:18px;opacity:1}}
.call-name{font-size:1.42rem;font-weight:900;letter-spacing:.01em;flex:1;line-height:1.15}
.call-name .kr{display:block;font-size:.85rem;font-weight:600;color:var(--accent);margin-top:4px}
.call-buttons{display:flex;gap:7px;align-items:center} .btn{border:none;border-radius:8px;padding:9px 18px;font-family:'Noto Sans KR',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:.2s} .btn:hover{filter:brightness(1.15)} .btn:active{transform:scale(.96)}
.btn-present{background:var(--present);color:#fff} .btn-late{background:var(--late);color:#fff} .btn-absent{background:var(--absent);color:#fff} .btn-speak{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 13px}
.kbd-hints{display:flex;gap:10px;font-size:.64rem;color:var(--text-dim);margin-left:4px} .kbd{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:.61rem;margin-right:2px}
.grid-area{flex:1;display:flex;flex-direction:column;min-height:0}
.student-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:5px;flex:1;min-height:0}
.student-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px 2px;border-radius:6px;background:var(--surface);border:1px solid var(--border);font-size:.78rem;font-weight:600;transition:.25s;position:relative;line-height:1.08;min-width:0;overflow:hidden}
.student-cell .main-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.98rem;font-weight:800;letter-spacing:-.025em} .student-cell .kr-name{font-size:.70rem;color:var(--accent);font-weight:700;margin-top:1px;white-space:nowrap} .student-cell .meta{font-size:.50rem;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-top:1px;white-space:nowrap}
.student-cell.calling{border-color:var(--accent);background:var(--accent-glow);box-shadow:0 0 16px var(--accent-glow);animation:pulse 1.2s ease-in-out infinite} @keyframes pulse{50%{box-shadow:0 0 28px rgba(78,205,196,.25)}}
.student-cell.present{background:var(--present-bg);border-color:rgba(46,204,113,.3)} .student-cell.absent{background:var(--absent-bg);border-color:rgba(231,76,60,.3)} .student-cell.late{background:var(--late-bg);border-color:rgba(243,156,18,.3)} .status-icon{position:absolute;top:3px;right:5px;font-size:.6rem}
.complete-overlay{position:fixed;inset:0;background:rgba(12,15,20,.9);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px)} .complete-overlay.active{display:flex}
.complete-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 38px;text-align:center;max-width:560px;width:92%;max-height:82vh;overflow-y:auto} .complete-box h2{font-size:1.35rem;margin-bottom:6px} .summary{color:var(--text-dim);margin-bottom:20px;font-size:.86rem}
.absent-item{padding:8px 12px;background:var(--absent-bg);border-radius:6px;margin-bottom:4px;font-size:.82rem;display:flex;justify-content:space-between;text-align:left;gap:12px} .late-item{background:var(--late-bg)} .tag{font-size:.68rem;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap} .tag-absent{background:rgba(231,76,60,.2);color:var(--absent)} .tag-late{background:rgba(243,156,18,.2);color:var(--late)} .all-present-msg{color:var(--present);font-weight:700;margin:12px 0}
.complete-buttons{margin-top:20px;display:flex;gap:10px;justify-content:center} .btn-dl,.btn-reset{padding:11px 22px;font-size:.86rem;border-radius:10px;border:none;font-family:'Noto Sans KR',sans-serif;font-weight:700;cursor:pointer} .btn-dl{background:linear-gradient(135deg,var(--accent),#3dbeb6);color:#fff} .btn-reset{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
@media(max-width:1100px){html,body{overflow:auto} .layout{height:auto;min-height:100vh} .student-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));grid-template-rows:none} .student-cell{min-height:64px} .kbd-hints{display:none}}
@media(max-width:700px){.layout{padding:10px} .header-row{flex-direction:column;align-items:flex-start} .stats-row{justify-content:flex-start} .call-bar{flex-wrap:wrap} .call-name{width:100%;font-size:1.15rem} .student-grid{grid-template-columns:repeat(3,1fr)} .voice-select{max-width:180px}}
</style>

let currentIndex=-1,statuses=new Array(students.length).fill(null),isStarted=false,isReverse=false,callOrder=[],callPos=-1,koreanFemaleVoice=null;
const now=new Date(),days=['일','월','화','수','목','금','토'];
const dateStr=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
const fileDateStr=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
document.getElementById('dateDisplay').textContent=dateStr;
document.getElementById('statTotal').textContent=students.length;

function voiceScore(v){
  const n=v.name.toLowerCase(); let s=0;
  if(!v.lang.toLowerCase().startsWith('ko')) return -999;
  if(/sunhi/.test(n)) s+=120; if(/seohyeon|seo hyeon|서현/.test(n)) s+=110; if(/jimin|ji min|지민/.test(n)) s+=105; if(/yujin|yu jin|유진/.test(n)) s+=100; if(/soonbok|soon bok|순복/.test(n)) s+=95; if(/heami|haemi|해미/.test(n)) s+=90;
  if(/google.*(한국|korean)|한국.*google/.test(n)) s+=75;
  if(/natural|neural|online|premium|enhanced|hd/.test(n)) s+=35;
  if(/female|woman|여성/.test(n)) s+=20;
  if(/injoon|hyunsu|bongjin|gookmin/.test(n)) s-=100;
  if(v.localService===false) s+=5;
  return s;
}
function loadVoices(){
  const ko=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko')).sort((a,b)=>voiceScore(b)-voiceScore(a));
  const sel=document.getElementById('voiceSelect'), remembered=localStorage.getItem('attendanceVoice');
  sel.innerHTML='';
  if(!ko.length){const o=document.createElement('option');o.textContent='한국어 기본 음성';o.value='';sel.appendChild(o);koreanFemaleVoice=null;return;}
  ko.forEach((v,i)=>{const o=document.createElement('option');o.value=v.name;o.textContent=(i===0?'★ ':'')+v.name;o.selected=(remembered? v.name===remembered : i===0);sel.appendChild(o);});
  koreanFemaleVoice=ko.find(v=>v.name===sel.value)||ko[0];
  sel.onchange=()=>{koreanFemaleVoice=ko.find(v=>v.name===sel.value)||ko[0];localStorage.setItem('attendanceVoice',koreanFemaleVoice.name);speak('음성 확인입니다.');};
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,300);setTimeout(loadVoices,1000);}
function speak(text,cb){
  if(!('speechSynthesis' in window)){if(cb)cb();return;}
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=.86; u.pitch=1.04; u.volume=1;
  if(!koreanFemaleVoice)loadVoices(); if(koreanFemaleVoice)u.voice=koreanFemaleVoice;
  const vi=document.getElementById('voiceIndicator'); vi.classList.add('active');
  u.onend=()=>{vi.classList.remove('active');if(cb)cb();}; u.onerror=()=>{vi.classList.remove('active');if(cb)cb();}; speechSynthesis.speak(u);
}
function speakStudent(s){speak(s.nameKr);}
function studentLabel(s){return s.nameEn?`${s.nameEn} <span class="kr-name">(${s.nameKr})</span>`:s.nameKr;}
function renderGrid(){
  document.getElementById('studentGrid').innerHTML=students.map((s,i)=>{let cls='',icon='';if(i===currentIndex&&statuses[i]===null)cls='calling';else if(statuses[i]==='present'){cls='present';icon='<span class="status-icon">✓</span>';}else if(statuses[i]==='absent'){cls='absent';icon='<span class="status-icon">✗</span>';}else if(statuses[i]==='late'){cls='late';icon='<span class="status-icon">△</span>';}
    const kr=s.nameEn?`<div class="kr-name">${s.nameKr}</div>`:''; return `<div class="student-cell ${cls}" id="cell-${i}">${icon}<div class="main-name">${s.displayName}</div>${kr}<div class="meta">${s.studentId}</div></div>`;}).join('');
}
function updateStats(){document.getElementById('statPresent').textContent=statuses.filter(s=>s==='present').length;document.getElementById('statAbsent').textContent=statuses.filter(s=>s==='absent').length;document.getElementById('statLate').textContent=statuses.filter(s=>s==='late').length;}
function showCurrent(){if(callPos>=callOrder.length){finishRollCall();return;}currentIndex=callOrder[callPos];const s=students[currentIndex];document.getElementById('callName').innerHTML=s.nameEn?`${s.displayName}<span class="kr">${s.nameKr} · ${s.studentId}</span>`:`${s.displayName}<span class="kr">${s.studentId} · ${s.dept}</span>`;document.getElementById('callBar').classList.add('active');renderGrid();setTimeout(()=>speakStudent(s),250);}
function startRollCall(reverse){isStarted=true;isReverse=reverse;callOrder=students.map((_,i)=>i);if(reverse)callOrder.reverse();callPos=0;currentIndex=callOrder[0];document.getElementById('btnStart').disabled=true;document.getElementById('btnStartRev').disabled=true;speak('지금부터 출석 부르겠습니다.',()=>setTimeout(showCurrent,350));}
function markStudent(status){if(callPos<0||callPos>=callOrder.length)return;statuses[currentIndex]=status;updateStats();callPos++;if(callPos<callOrder.length)showCurrent();else{currentIndex=-1;renderGrid();finishRollCall();}}
function speakCurrent(){if(callPos>=0&&callPos<callOrder.length)speakStudent(students[callOrder[callPos]]);}
function finishRollCall(){document.getElementById('callBar').classList.remove('active');document.getElementById('completeOverlay').classList.add('active');const p=statuses.filter(s=>s==='present').length,a=statuses.filter(s=>s==='absent').length,l=statuses.filter(s=>s==='late').length;document.getElementById('completeSummary').textContent=`출석 ${p}명 · 지각 ${l}명 · 결석 ${a}명`;const issues=students.filter((_,i)=>statuses[i]==='absent'||statuses[i]==='late');const el=document.getElementById('absentList');if(!issues.length)el.innerHTML='<p class="all-present-msg">🎉 전원 출석!</p>';else el.innerHTML=issues.map(s=>{const idx=students.indexOf(s),st=statuses[idx],tagCls=st==='absent'?'tag-absent':'tag-late',tagTxt=st==='absent'?'결석':'지각',itemCls=st==='late'?'absent-item late-item':'absent-item',name=s.nameEn?`${s.displayName} (${s.nameKr})`:s.displayName;return `<div class="${itemCls}"><span>${name} · ${s.studentId}</span><span class="tag ${tagCls}">${tagTxt}</span></div>`;}).join('');speak('출석 체크가 완료되었습니다.');}
function downloadRecord(){
 const p=statuses.filter(s=>s==='present').length,a=statuses.filter(s=>s==='absent').length,l=statuses.filter(s=>s==='late').length;
 let c=`과목: ${COURSE_NAME}
날짜: ${dateStr}
========================================

[요약]
전체: ${students.length}명 | 출석: ${p}명 | 지각: ${l}명 | 결석: ${a}명

`;
 const add=(title,status)=>{const arr=students.filter((_,i)=>statuses[i]===status);if(!arr.length)return;c+=`[${title}]
`;arr.forEach(s=>{const nm=s.nameEn?`${s.displayName} (${s.nameKr})`:s.displayName;c+=`  - ${nm} | ${s.studentId} | ${s.dept} ${s.year}학년${s.nationality?' | '+s.nationality:''}
`;});c+='\n';}; add('결석','absent');add('지각','late');
 const blob=new Blob(['\uFEFF'+c],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=`${COURSE_NAME}_${fileDateStr}.txt`;anchor.click();URL.revokeObjectURL(url);
}
function resetAll(){speechSynthesis.cancel();currentIndex=-1;callPos=-1;callOrder=[];statuses=new Array(students.length).fill(null);isStarted=false;document.getElementById('completeOverlay').classList.remove('active');document.getElementById('callBar').classList.remove('active');document.getElementById('btnStart').disabled=false;document.getElementById('btnStartRev').disabled=false;updateStats();renderGrid();}
document.addEventListener('keydown',e=>{if(!isStarted||currentIndex<0)return;if(e.key==='1')markStudent('present');else if(e.key==='2')markStudent('late');else if(e.key==='3')markStudent('absent');else if(e.key==='r'||e.key==='R')speakCurrent();});
renderGrid();updateStats();
</script>
